<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="robots" content="noindex, nofollow">
<title>업무 도구 — {{name}}</title>
<meta name="description" content="법인 자료 정리 도구, 경영 플랜 비교, 법령 서재, 서식 찾기, 자주 쓰는 공공 조회 사이트를 한곳에 모은 업무 화면입니다.">
<link rel="canonical" href="{{site_url}}/tools/">
<script type="application/ld+json">{{tools_jsonld}}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../assets/style.css">
<style>
/* 업무 도구 전용. 첫 화면(index)과 같은 남색·은색, 테두리 대신 그림자, 움직임은 등장·숫자·선 그리기·호버 네 가지. */
body.tools-page { background: var(--cool); }
.thero { position: relative; overflow: hidden; color: #fff; padding: 68px 24px 60px;
  background: radial-gradient(1100px 560px at 72% -12%, #1e293b 0%, var(--navy) 55%, var(--navy-3) 100%); }
.thero-dust { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.thero-inner { position: relative; max-width: var(--wrap); margin: 0 auto; }
.tkicker { display: inline-flex; align-items: center; gap: 12px; font-size: 13px; letter-spacing: .14em; font-weight: 700; color: var(--gold); margin-bottom: 18px; }
.tkicker::before { content: ""; width: 22px; height: 1.5px; background: var(--gold); }
.thero h1 { font-size: clamp(30px, 5vw, 50px); line-height: 1.15; font-weight: 800; margin: 0 0 14px;
  background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.thero-sub { max-width: 640px; color: #cbd5e1; font-size: 16px; line-height: 1.75; margin: 0 0 34px; }
.tstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; max-width: 780px; }
.tstat { position: relative; padding: 18px 18px 16px; border-radius: 16px; background: rgba(255, 255, 255, .05); backdrop-filter: blur(6px); overflow: hidden; }
.tstat::before { content: ""; position: absolute; inset: 0 0 auto; height: 2px; background: var(--gold-grad); }
.tstat b { display: block; font-size: 30px; font-weight: 800; letter-spacing: -.03em; color: #fff; font-variant-numeric: tabular-nums; }
.tstat b small { font-size: .55em; margin-left: 2px; color: var(--gold); }
.tstat > span { display: block; margin-top: 4px; font-size: 13px; color: #cbd5e1; font-weight: 600; }
.twrap { max-width: var(--wrap); margin: 0 auto; padding: 40px 24px 70px; }
.tfeat { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; margin-bottom: 44px; }
.tfeat-main { position: relative; display: flex; flex-direction: column; text-decoration: none; color: #fff; border-radius: 24px; padding: 36px 34px; overflow: hidden;
  background: linear-gradient(135deg, #1e293b, #0f172a 60%, #080e1c); box-shadow: 0 30px 60px -30px rgba(15, 23, 42, .6);
  transition: transform .45s var(--ease), box-shadow .45s ease, opacity .9s ease; }
.tfeat-main:hover { transform: translateY(-4px); box-shadow: 0 40px 70px -30px rgba(15, 23, 42, .7); color: #fff; }
.tfeat-main::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(120deg, transparent 30%, rgba(199, 204, 212, .12) 50%, transparent 70%); transform: translateX(-120%); transition: transform 1.1s var(--ease); }
.tfeat-main:hover::after { transform: translateX(120%); }
.tfeat-kicker { font-size: 13px; letter-spacing: .14em; font-weight: 700; color: var(--gold); margin-bottom: 14px; }
.tfeat-main h2 { font-size: clamp(22px, 2.6vw, 30px); line-height: 1.3; font-weight: 800; margin: 0 0 12px; }
.tfeat-main p { color: #cbd5e1; font-size: 15px; line-height: 1.7; margin: 0 0 26px; max-width: 440px; }
.tfeat-cta { margin-top: auto; align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 999px;
  background: var(--gold-grad); color: var(--navy); font-weight: 800; font-size: 15px; box-shadow: 0 10px 28px -10px rgba(199, 204, 212, .7); transition: transform .35s var(--ease); }
.tfeat-main:hover .tfeat-cta { transform: translateX(4px); }
.tfeat-art { position: absolute; right: 22px; bottom: 18px; width: min(250px, 38%); height: auto; opacity: .9; pointer-events: none; }
.tfeat-art path, .tfeat-art rect { fill: none; stroke: #c7ccd4; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.8s var(--ease) forwards; }
.tfeat-art .d2 { animation-delay: .35s; } .tfeat-art .d3 { animation-delay: .7s; } .tfeat-art .d4 { animation-delay: 1.05s; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.tfeat-side { display: grid; gap: 18px; }
.tcard { position: relative; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--ink); background: #fff; border-radius: 22px; padding: 26px 24px; overflow: hidden;
  box-shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 20px 40px -30px rgba(15, 23, 42, .35); transition: transform .4s var(--ease), box-shadow .4s ease, opacity .9s ease; }
.tcard::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--gold-grad); transform: scaleX(0); transform-origin: left; transition: transform .5s var(--ease); }
.tcard:hover { transform: translateY(-4px); box-shadow: 0 28px 50px -30px rgba(15, 23, 42, .5); color: var(--ink); }
.tcard:hover::before { transform: scaleX(1); }
.tcard svg { width: 34px; height: 34px; stroke: var(--navy); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tcard b { font-size: 18px; font-weight: 800; }
.tcard span { font-size: 14px; color: var(--slate); line-height: 1.6; }
.tcard .go { margin-top: auto; padding-top: 10px; font-size: 14px; font-weight: 700; color: var(--gold-text); }
.tcard .go::after { content: " →"; }
.tgroup { margin-bottom: 34px; }
.tlinks { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.tlink { display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--ink); background: #fff; border-radius: 16px; padding: 16px 18px;
  box-shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 14px 30px -26px rgba(15, 23, 42, .35); transition: transform .35s var(--ease), box-shadow .35s ease, opacity .9s ease; }
.tlink:hover { transform: translateY(-3px); box-shadow: 0 22px 40px -28px rgba(15, 23, 42, .5); color: var(--ink); }
.tlink-mark { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #fff; background: linear-gradient(135deg, #1e293b, #0f172a); }
.tlink b { font-size: 15px; font-weight: 700; flex: 1; }
.tlink svg { width: 18px; height: 18px; stroke: var(--mute); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .35s var(--ease), stroke .35s; }
.tlink:hover svg { transform: translate(2px, -2px); stroke: var(--navy); }
.tfoot { max-width: var(--wrap); margin: 0 auto; padding: 0 24px 60px; color: var(--mute); font-size: 13px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.tfoot a { color: var(--gold-text); font-weight: 700; text-decoration: none; }
@media (max-width: 760px) {
  .thero { padding: 48px 20px 40px; } .tstats { grid-template-columns: repeat(2, 1fr); } .tstat b { font-size: 26px; }
  .tfeat { grid-template-columns: 1fr; } .tfeat-main { padding: 28px 24px 30px; } .tfeat-art { display: none; } .twrap { padding: 28px 16px 56px; }
}
@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; } .tfeat-art path, .tfeat-art rect { animation: none; stroke-dashoffset: 0; } .tfeat-main::after { display: none; }
}
</style>
</head>
<body class="tools-page">
<header class="thero">
  <canvas class="thero-dust" aria-hidden="true"></canvas>
  <div class="thero-inner">
    <p class="tkicker">{{name}} 전용 · 업무 도구</p>
    <h1>보고서 하나로,<br>미팅 자료까지</h1>
    <p class="thero-sub">크레탑 보고서를 넣으면 본부 엑셀·계산표·브리핑 16장이 한 번에 나옵니다. 이 페이지는 비밀번호로 잠겨 있고 검색에 노출되지 않습니다. 각 사이트 로그인은 직접 하세요.</p>
    <div class="tstats">
      <div class="tstat reveal"><b><span data-to="15">0</span><small>장</small></b><span>브리핑 자료</span></div>
      <div class="tstat reveal"><b><span data-to="4">0</span><small>종</small></b><span>법령 산식 계산표</span></div>
      <div class="tstat reveal"><b><span data-to="49">0</span><small>주제</small></b><span>법령 서재 7영역</span></div>
      <div class="tstat reveal"><b><span data-to="1375">0</span><small>건</small></b><span>시행규칙 서식</span></div>
    </div>
  </div>
</header>
<main class="twrap">
  {{tools_links}}
</main>
<footer class="tfoot">
  <span>파일은 이 기기 안에서만 읽습니다. 어디에도 올리지 않습니다.</span>
  <a href="../">← 홈페이지로</a>
</footer>
<script>
// 등장: 같은 묶음 안에서 0.08초씩 늦게. 움직임 줄이기 설정이면 CSS가 끈다. (index.html 과 같은 코드)
(function () {
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add('in'); io.unobserve(e.target);
  }), { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
  const els = Array.from(document.querySelectorAll('.reveal'));
  els.forEach(el => {
    const sib = Array.from(el.parentElement.children).filter(c => c.classList.contains('reveal'));
    el.style.transitionDelay = Math.min(sib.indexOf(el), 6) * 80 + 'ms';
    io.observe(el);
  });
  // 안전장치: 관찰자가 안 울리는 환경(일부 폰 브라우저·에뮬레이션)에서도 화면 안 요소는 직접 재서 보이게 한다.
  const check = () => els.forEach(el => {
    if (el.classList.contains('in')) return;
    const r = el.getBoundingClientRect();
    if (r.top < innerHeight * 0.94) el.classList.add('in');   // 위로 지나친 것도 켠다(빠르게 넘기면 건너뛰어 빈칸으로 남는다)
  });
  addEventListener('scroll', check, { passive: true });
  addEventListener('load', check);
  setTimeout(check, 400);
  // 스크롤 이벤트도 안 오는 환경 대비: 0.5초마다 재다가 전부 나타나면 멈춘다(요소 30여 개라 가볍다).
  const iv = setInterval(() => { check(); if (els.every(el => el.classList.contains('in'))) clearInterval(iv); }, 500);
})();
// 숫자: 0부터 올라간다(1.4초, 끝에서 느려짐). 움직임 줄이기면 바로 최종값.
(function () {
  const els = Array.from(document.querySelectorAll('[data-to]'));
  const fin = () => els.forEach(e => { e.textContent = (+e.dataset.to).toLocaleString('ko-KR'); });
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return fin();
  const t0 = performance.now(), D = 1400, ease = x => 1 - Math.pow(1 - x, 3);
  (function step(t) {
    const p = Math.min(1, (t - t0) / D);
    els.forEach(e => { e.textContent = Math.round(+e.dataset.to * ease(p)).toLocaleString('ko-KR'); });
    if (p < 1) requestAnimationFrame(step); else fin();
  })(t0);
})();
// 머리 부분 점·선 연결(첫 화면과 같은 움직임). 커서 근처 점과도 선이 닿는다.
(function () {
  const cv = document.querySelector('.thero-dust');
  if (!cv || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const ctx = cv.getContext('2d'), hero = cv.parentElement;
  const LINK = 130;
  let w = 0, h = 0, dots = [], on = false, mx = -1e4, my = -1e4;
  const size = () => {
    if (hero.offsetWidth === w) return;
    const d = Math.min(devicePixelRatio || 1, 2);
    w = hero.offsetWidth; h = hero.offsetHeight;
    cv.width = w * d; cv.height = h * d; ctx.setTransform(d, 0, 0, d, 0, 0);
    dots = Array.from({ length: w < 700 ? 30 : 60 }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - .5) * .28, vy: (Math.random() - .5) * .28, r: Math.random() * 1.2 + .9 }));
  };
  const draw = () => {
    if (!on) return;
    ctx.clearRect(0, 0, w, h);
    for (const p of dots) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
    }
    ctx.lineWidth = .8;
    for (let i = 0; i < dots.length; i++) {
      const a = dots[i];
      for (let j = i + 1; j < dots.length; j++) {
        const b = dots[j], dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy);
        if (d > LINK) continue;
        ctx.strokeStyle = `rgba(199,204,212,${(1 - d / LINK) * .28})`;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
      const d = Math.hypot(a.x - mx, a.y - my);
      if (d < LINK * 1.4) {
        ctx.strokeStyle = `rgba(238,241,245,${(1 - d / (LINK * 1.4)) * .45})`;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mx, my); ctx.stroke();
      }
    }
    ctx.fillStyle = 'rgba(238,241,245,.75)';
    for (const p of dots) { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); }
    requestAnimationFrame(draw);
  };
  hero.addEventListener('pointermove', e => { const r = cv.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top; });
  hero.addEventListener('pointerleave', () => { mx = my = -1e4; });
  addEventListener('resize', size);
  size();
  new IntersectionObserver(([e]) => { const was = on; on = e.isIntersecting; if (on && !was) requestAnimationFrame(draw); }).observe(hero);
})();
</script>
</body>
</html>
